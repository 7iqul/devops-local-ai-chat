services:
  ollama:
    image: ollama/ollama:latest
    container_name: devops-guide-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11435:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  app:
    build: .
    container_name: devops-guide-web
    environment:
      OLLAMA_URL: http://ollama:11434
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
volumes:
  ollama_data:
